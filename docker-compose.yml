# VTP - منصة التعليم الافتراضية
# Docker Compose للتشغيل المحلي
# محسّن لجهاز: 16GB RAM, 4 CPU cores

services:
  # ═══════════════════════════════════════════════════════════
  # قاعدة البيانات PostgreSQL
  # ═══════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: vtp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vtp_db}
      # UTF-8 encoding supports Arabic text
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vtp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # Redis للذاكرة المؤقتة والجلسات
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: vtp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vtp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # خادم Go API الرئيسي
  # ═══════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vtp-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/vtp_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      JWT_REFRESH_EXPIRY_HOURS: ${JWT_REFRESH_EXPIRY_HOURS:-168}
      JITSI_SERVER_URL: ${JITSI_SERVER_URL:-https://meet.jit.si}
      MEDIASOUP_URL: "http://mediasoup-sfu:3000"
      CDN_URL: ${CDN_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      RESET_BASE_URL: ${RESET_BASE_URL:-}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    networks:
      - vtp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════
  # الواجهة الأمامية Next.js
  # ═══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./vtp-frontend
      dockerfile: Dockerfile
    container_name: vtp-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_WS_URL: "ws://localhost:3003"
      NEXT_PUBLIC_SIGNALING_URL: "http://localhost:3003"
      NODE_ENV: production
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    networks:
      - vtp-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # MediaSoup SFU - WebRTC Selective Forwarding Unit
  # ═══════════════════════════════════════════════════════════
  mediasoup-sfu:
    build:
      context: ./mediasoup-sfu
      dockerfile: Dockerfile
    container_name: vtp-mediasoup
    environment:
      PORT: "3000"
      LOG_LEVEL: "info"
      MEDIASOUP_LISTEN_IP: "0.0.0.0"
      MEDIASOUP_ANNOUNCED_IP: "127.0.0.1"
      RTC_MIN_PORT: "40000"
      RTC_MAX_PORT: "49999"
    ports:
      - "3002:3000"
      - "40000-40100:40000-40100/udp"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    networks:
      - vtp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════
  # Node.js Signaling Server - Socket.IO v4
  # ═══════════════════════════════════════════════════════════
  signaling:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    container_name: vtp-signaling
    environment:
      PORT: "3003"
      MEDIASOUP_URL: "http://mediasoup-sfu:3000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:8080,http://127.0.0.1:3001}
      LOG_LEVEL: "info"
    ports:
      - "3003:3003"
    depends_on:
      - mediasoup-sfu
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - vtp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ═══════════════════════════════════════════════════════════
  # pgAdmin - إدارة قاعدة البيانات (اختياري)
  # ═══════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vtp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vtp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - vtp-network
    profiles:
      - tools

# ═══════════════════════════════════════════════════════════
# وحدات التخزين
# ═══════════════════════════════════════════════════════════
volumes:
  postgres_data:
    name: vtp_postgres_data
  redis_data:
    name: vtp_redis_data

# ═══════════════════════════════════════════════════════════
# الشبكة
# ═══════════════════════════════════════════════════════════
networks:
  vtp-network:
    name: vtp_network
    driver: bridge
